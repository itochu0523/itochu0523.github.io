<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script>
(function(){
  const c = document.createElement('canvas');
  c.width = 180; c.height = 180;
  const x = c.getContext('2d');

  // 角丸背景
  x.beginPath();
  x.moveTo(36,0); x.lineTo(144,0); x.quadraticCurveTo(180,0,180,36);
  x.lineTo(180,144); x.quadraticCurveTo(180,180,144,180);
  x.lineTo(36,180); x.quadraticCurveTo(0,180,0,144);
  x.lineTo(0,36); x.quadraticCurveTo(0,0,36,0);
  x.fillStyle = '#2D5016'; x.fill();

  // 内側サブ背景
  x.beginPath();
  x.moveTo(44,8); x.lineTo(136,8); x.quadraticCurveTo(172,8,172,44);
  x.lineTo(172,136); x.quadraticCurveTo(172,172,136,172);
  x.lineTo(44,172); x.quadraticCurveTo(8,172,8,136);
  x.lineTo(8,44); x.quadraticCurveTo(8,8,44,8);
  x.fillStyle = '#3a6b1a'; x.globalAlpha = 0.4; x.fill(); x.globalAlpha = 1;

  // 影
  x.beginPath(); x.ellipse(90,148,58,12,0,0,Math.PI*2);
  x.fillStyle = '#1a3009'; x.globalAlpha = 0.35; x.fill(); x.globalAlpha = 1;

  // 丼フチ
  x.beginPath(); x.roundRect(32,72,116,14,5);
  x.fillStyle = '#E8D5A8'; x.fill();
  x.strokeStyle = '#C4A96A'; x.lineWidth = 2; x.stroke();

  // 丼本体
  x.beginPath(); x.roundRect(38,82,104,68,10);
  x.fillStyle = '#F5E6C8'; x.fill();
  x.strokeStyle = '#C4A96A'; x.lineWidth = 2.5; x.stroke();

  // 白ごはん
  x.beginPath(); x.ellipse(90,95,46,12,0,0,Math.PI*2);
  x.fillStyle = '#FFFEF0'; x.fill();

  // そぼろ（左）
  const sb = [[52,90],[62,84],[48,98],[60,97],[54,78],[66,78],[44,87],[56,104]];
  sb.forEach(([px,py])=>{ x.beginPath(); x.arc(px,py,4,0,Math.PI*2); x.fillStyle='#8B4513'; x.fill(); });

  // 卵そぼろ（右）
  const eg = [[118,90],[128,84],[112,97],[122,98],[116,78],[130,80],[132,93],[108,104]];
  eg.forEach(([px,py])=>{ x.beginPath(); x.arc(px,py,4,0,Math.PI*2); x.fillStyle='#F5C842'; x.fill(); });

  // 仕切り
  x.beginPath(); x.moveTo(90,75); x.lineTo(90,110);
  x.strokeStyle='#C4A96A'; x.lineWidth=1.5; x.globalAlpha=0.5; x.stroke(); x.globalAlpha=1;

  // 三つ葉
  x.beginPath(); x.arc(90,63,7,0,Math.PI*2); x.fillStyle='#4CAF50'; x.fill();
  x.beginPath(); x.arc(82,57,6,0,Math.PI*2); x.fillStyle='#4CAF50'; x.fill();
  x.beginPath(); x.arc(98,57,6,0,Math.PI*2); x.fillStyle='#4CAF50'; x.fill();
  x.beginPath(); x.moveTo(90,70); x.lineTo(90,82);
  x.strokeStyle='#388E3C'; x.lineWidth=2; x.stroke();

  // テキスト
  x.fillStyle='rgba(255,255,255,0.95)';
  x.font='bold 20px "Hiragino Kaku Gothic ProN",sans-serif';
  x.textAlign='center'; x.fillText('ひろあき',90,166);

  // apple-touch-icon設定
  const lk = document.createElement('link');
  lk.rel = 'apple-touch-icon';
  lk.href = c.toDataURL('image/png');
  document.head.appendChild(lk);

  // favicon設定
  const fi = document.createElement('link');
  fi.rel = 'icon'; fi.type = 'image/png';
  fi.href = c.toDataURL('image/png');
  document.head.appendChild(fi);
})();
</script>

<style>

<header>

<!-- View Modal -->

    </div>

        <div class="section-title">▍材料</div>
        <div id="modalIngredients"></div>
      </div>
      <div class="steps-list">

        <div id="modalSteps"></div>
      </div>
      <div class="notes-box" id="modalNotes" style="display:none">
        <div class="section-title" style="margin-bottom:6px">▍ポイント</div>
        <p id="modalNotesText"></p>
      </div>
      <button class="modal-edit-btn" onclick="openEditFromView()">✏️ このレシピを編集</button>
    </div>
  </div>
</div>

<!-- Edit/Add Modal -->
<div class="modal-overlay" id="editOverlay" onclick="closeEditModal(event)">
  <div class="edit-modal" id="editModal">
    <div class="edit-modal-top">
      <button class="close-btn" onclick="closeEdit()">✕</button>
      <h2 id="editTitle">レシピを編集</h2>
    </div>
    <div class="edit-body">
      <div class="form-group">
        <label>タイトル</label>
        <input type="text" id="editName" placeholder="例：親子丼">
      </div>
      <div class="form-group">
        <label>絵文字</label>
        <input type="text" id="editEmoji" placeholder="🍳" style="max-width:80px">
      </div>
      <div class="form-group">
        <label>カテゴリー</label>
        <select id="editCategory">
          <option>丼</option>
          <option>炒め物</option>
          <option>パスタ</option>
          <option>副菜・和え物</option>
          <option>サンドイッチ</option>
          <option>鍋・スープ</option>
          <option>おにぎり</option>
          <option>ご飯もの</option>
          <option>揚げ物</option>
          <option>タレ・つゆ</option>
          <option>下ごしらえ</option>
          <option>その他</option>
        </select>
      </div>
      <div class="form-group">
        <label>基本人数（人前）</label>
        <input type="number" id="editServings" value="2" min="1" style="max-width:80px">
      </div>
      <div class="form-group">
        <label>材料</label>
        <div id="editIngredients"></div>
        <button class="add-row-btn" onclick="addIngredientRow()">＋ 材料を追加</button>
      </div>
      <div class="form-group">
        <label>手順</label>
        <div id="editSteps"></div>
        <button class="add-row-btn" onclick="addStepRow()">＋ 手順を追加</button>
      </div>
      <div class="form-group">
        <label>ポイント・メモ</label>
        <textarea id="editNotes" placeholder="コツや注意点など..."></textarea>
      </div>
      <button class="save-btn" onclick="saveRecipe()">💾 保存する</button>
      <button class="delete-recipe-btn" id="deleteBtn" onclick="deleteRecipe()" style="display:none">🗑️ このレシピを削除</button>
    </div>
  </div>
</div>

let recipes = [];
let currentCategory = 'すべて';
let currentRecipe = null;
let currentServings = 2;
let editingId = null;

async function loadRecipes() {
  try {
    const result = await window.storage.get('hiro_recipes');
    if (result && result.value) {
      const saved = JSON.parse(result.value);
      recipes = saved.length > 0 ? saved : [...defaultRecipes];
    } else {
      recipes = [...defaultRecipes];
    }
  } catch(e) {
    recipes = [...defaultRecipes];
  }
  renderAll();
}

async function saveToStorage() {
  try {
    await window.storage.set('hiro_recipes', JSON.stringify(recipes));
  } catch(e) {}
}

const allCategories = ['すべて','丼','炒め物','パスタ','副菜・和え物','サンドイッチ','鍋・スープ','おにぎり','ご飯もの','揚げ物','タレ・つゆ','下ごしらえ','その他'];

function renderAll() {
  renderCategories();
  filterRecipes();
}

function renderCategories() {
  const el = document.getElementById('categories');
  el.innerHTML = allCategories.map(cat => `
    <button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
  `).join('');
}

function setCategory(cat) {
  currentCategory = cat;
  renderAll();
}

function filterRecipes() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = recipes.filter(r => {
    const matchCat = currentCategory === 'すべて' || r.category === currentCategory;
    const matchQuery = !query || r.title.includes(query) || (r.tags||[]).some(t => t.includes(query));
    return matchCat && matchQuery;
  });
  const el = document.getElementById('recipeList');
  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty-state"><div style="font-size:40px">🍳</div><p>レシピが見つかりません</p></div>`;
    return;
  }
  el.innerHTML = filtered.map(r => `
    <div class="recipe-card" onclick="openRecipe(${r.id})">
      <div class="card-header">
        <div class="card-title">${r.title}</div>
        <div class="card-emoji">${r.emoji}</div>
      </div>
      <div class="card-footer">
        <div class="card-tags">
          <span class="tag">${r.category}</span>
          ${(r.tags||[]).slice(0,2).map(t=>`<span class="tag">${t}</span>`).join('')}
        </div>
        <button class="edit-small" onclick="event.stopPropagation();openEditRecipe(${r.id})">編集</button>
      </div>
    </div>
  `).join('');
}

function openRecipe(id) {
  currentRecipe = recipes.find(r => r.id === id);
  if(!currentRecipe) return;
  currentServings = currentRecipe.baseServings || 2;
  renderModal();
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeRecipe() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeRecipe();
}

function changeServings(delta) {
  currentServings = Math.max(1, currentServings + delta);
  renderModal();
}

function renderModal() {
  const r = currentRecipe;
  const base = r.baseServings || 2;
  const ratio = currentServings / base;
  document.getElementById('modalTitle').textContent = `${r.emoji} ${r.title}`;
  document.getElementById('servingsCount').textContent = currentServings;

  document.getElementById('modalIngredients').innerHTML = (r.ingredients||[]).map(ing => {
    let amtDisplay = '';
    if (typeof ing.amount === 'number') {
      const a = ing.amount * ratio;
      amtDisplay = (a % 1 === 0 ? a : Math.round(a * 10) / 10) + (ing.unit || '');
    } else {
      amtDisplay = String(ing.amount) + (ing.unit ? ' ' + ing.unit : '');
    }
    return `<div class="ingredient-row"><span>${ing.name}</span><span class="ingredient-amount">${amtDisplay}</span></div>`;
  }).join('');

  document.getElementById('modalSteps').innerHTML = (r.steps||[]).map((s,i) => `
    <div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>
  `).join('');

  if (r.notes) {
    document.getElementById('modalNotes').style.display = 'block';
    document.getElementById('modalNotesText').textContent = r.notes;
  } else {
    document.getElementById('modalNotes').style.display = 'none';
  }
}

function openEditFromView() {
  closeRecipe();
  setTimeout(() => openEditRecipe(currentRecipe.id), 150);
}

// Edit/Add
function openAddRecipe() {
  editingId = null;
  document.getElementById('editTitle').textContent = '新しいレシピを追加';
  document.getElementById('editName').value = '';
  document.getElementById('editEmoji').value = '🍳';
  document.getElementById('editCategory').value = '丼';
  document.getElementById('editServings').value = 2;
  document.getElementById('editNotes').value = '';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('editIngredients').innerHTML = '';
  document.getElementById('editSteps').innerHTML = '';
  addIngredientRow();
  addIngredientRow();
  addStepRow();
  document.getElementById('editOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openEditRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  document.getElementById('editTitle').textContent = 'レシピを編集';
  document.getElementById('editName').value = r.title;
  document.getElementById('editEmoji').value = r.emoji;
  document.getElementById('editCategory').value = r.category;
  document.getElementById('editServings').value = r.baseServings || 2;
  document.getElementById('editNotes').value = r.notes || '';
  document.getElementById('deleteBtn').style.display = 'block';

  const ingEl = document.getElementById('editIngredients');
  ingEl.innerHTML = '';
  (r.ingredients||[]).forEach(ing => addIngredientRow(ing.name, String(ing.amount), ing.unit||''));

  const stepEl = document.getElementById('editSteps');
  stepEl.innerHTML = '';
  (r.steps||[]).forEach(s => addStepRow(s));

  document.getElementById('editOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeEdit() {
  document.getElementById('editOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeEditModal(e) {
  if (e.target === document.getElementById('editOverlay')) closeEdit();
}

function addIngredientRow(name='', amount='', unit='') {
  const el = document.getElementById('editIngredients');
  const div = document.createElement('div');
  div.className = 'form-row';
  div.innerHTML = `
    <input type="text" placeholder="材料名" value="${name}" style="flex:2">
    <input type="text" placeholder="量" value="${amount}" style="flex:1">
    <input type="text" placeholder="単位" value="${unit}" style="flex:1">
    <button class="del-row" onclick="this.parentElement.remove()">×</button>
  `;
  el.appendChild(div);
}

function addStepRow(text='') {
  const el = document.getElementById('editSteps');
  const idx = el.children.length + 1;
  const div = document.createElement('div');
  div.className = 'form-row';
  div.style.alignItems = 'flex-start';
  div.innerHTML = `
    <div style="padding:8px;font-size:12px;font-weight:700;color:var(--primary);min-width:24px">${idx}</div>
    <textarea placeholder="手順を入力..." style="flex:1;resize:vertical;min-height:60px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none">${text}</textarea>
    <button class="del-row" onclick="this.parentElement.remove()">×</button>
  `;
  el.appendChild(div);
}

function saveRecipe() {
  const title = document.getElementById('editName').value.trim();
  if (!title) { alert('タイトルを入力してください'); return; }

  const ingredients = Array.from(document.getElementById('editIngredients').children).map(row => {
    const inputs = row.querySelectorAll('input');
    const name = inputs[0].value.trim();
    const amtStr = inputs[1].value.trim();
    const unit = inputs[2].value.trim();
    if (!name) return null;
    const amtNum = parseFloat(amtStr);
    return { name, amount: isNaN(amtNum) ? amtStr : amtNum, unit };
  }).filter(Boolean);

  const steps = Array.from(document.getElementById('editSteps').children).map(row => {
    const ta = row.querySelector('textarea');
    return ta ? ta.value.trim() : '';
  }).filter(Boolean);

  const recipe = {
    id: editingId || Date.now(),
    title,
    emoji: document.getElementById('editEmoji').value || '🍳',
    category: document.getElementById('editCategory').value,
    tags: [document.getElementById('editCategory').value],
    baseServings: parseInt(document.getElementById('editServings').value) || 2,
    ingredients,
    steps,
    notes: document.getElementById('editNotes').value.trim(),
  };

  if (editingId) {
    const idx = recipes.findIndex(r => r.id === editingId);
    if (idx >= 0) recipes[idx] = recipe;
  } else {
    recipes.push(recipe);
  }

  saveToStorage();
  closeEdit();
  filterRecipes();
}

function deleteRecipe() {
  if (!editingId) return;
  if (!confirm('このレシピを削除しますか？')) return;
  recipes = recipes.filter(r => r.id !== editingId);
  saveToStorage();
  closeEdit();
  filterRecipes();
}

loadRecipes();
